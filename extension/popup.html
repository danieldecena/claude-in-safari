<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px -apple-system, sans-serif; margin: 12px; width: 220px; }
  #state { display: flex; gap: 6px; align-items: center; font-weight: 600; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: gray; }
  #dot.on { background: #34c759; }
  #dot.off { background: #ff9f0a; }
  #detail { margin-top: 6px; opacity: 0.75; overflow-wrap: anywhere; }
  button { width: 100%; padding: 6px; margin-top: 10px; font: inherit; }
</style>
</head>
<body>
  <div id="state"><span id="dot"></span><span id="label">Checking...</span></div>
  <div id="detail"></div>
  <button id="reconnect">Reconnect</button>
  <script src="popup.js"></script>
</body>
</html>
